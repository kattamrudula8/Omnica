                      doc.open();

                    } else if (fileExt.match(/\.(mp4|webm|ogg)$/)) {
                      const doc = iframe.contentWindow.document;
                      doc.open();
                      doc.write(`<body style="margin:0"><video src="${fileUrl}" controls style="width:100%;height:auto;"></video></body>`);
                      doc.close();

                    } else if (fileExt.match(/\.(mp3|wav|aac)$/)) {
                      const doc = iframe.contentWindow.document;
                      doc.open();
                      doc.write(`<body style="margin:0"><audio controls src="${fileUrl}" style="width:100%"></audio></body>`);
                      doc.close();

                      const doc = iframe.contentWindow.document;
                      doc.open();
                      doc.write(`<body><p style="color: orange;">CSV preview is not available.</p></body>`);
                      doc.close();

                    } else if (content && typeof content === "string") {
                      const doc = iframe.contentWindow.document;
                      doc.open();
                      doc.write(`<pre style="white-space: pre-wrap; font-size: 14px; padding: 1rem;">${content}</pre>`);

                      const doc = iframe.contentWindow.document;
                      doc.open();
                      doc.write(`<p style="color: gray;">No preview available for this file type.</p>`);
                      doc.close();
                    }
                  }, 0);
                }

              }).appendTo('#file-dropdown');
            }

            else {
              alert("Error loading files: " + data.message);
            }

      function fetchTopic(fileName, id) {
        console.log("Fetching topic for:", fileName);

        Swal.fire({
          title: "Fetching topics...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          }

        const paramsObj = {
          userName: userName,
          wspName: "",
          selectedPatient: selectedPatient,

          .then(response => response.json())
          .then(data => {
            Swal.close();

            const topicContainer = document.getElementById(`topic_items_${id}`);
            topicContainer.innerHTML = ""; // Clear old items if any

            if (data.status === "success") {
              const topics = data.topics;

              if (Array.isArray(topics) && topics.length > 0) {
                topics.forEach((topic, index) => {
                  const checkboxId = `topic_checkbox_${id}_${index}`;
                  const checkboxDiv = document.createElement("div");

                  checkboxDiv.innerHTML = `
              <input type="checkbox" id="${checkboxId}" name="topic_${id}" value="${topic}">
              <label for="${checkboxId}"> ${topic}</label>
            `;

                  topicContainer.appendChild(checkboxDiv);
                });

                // Enable the "Make Summary" button
                const summaryButton = document.getElementById(`makeSummary_${id}`);
                if (summaryButton) {
                  summaryButton.style.display = "block";
                  summaryButton.disabled = false;
                }

                const includeButton = document.getElementById(`includeFileSummary_${id}`);
                if (includeButton) {
                  includeButton.style.display = "block";
                  includeButton.disabled = false;
                }
              } else {
                topicContainer.innerHTML = "<div class='text-danger'>No topics returned.</div>";
              }
            } else {
              topicContainer.innerHTML = `<div class='text-danger'>${data.message || "Failed to fetch topics."}</div>`;
            }
          })
          .catch(error => {
            Swal.close();
            console.error("Fetch topic error:", error);
            Swal.fire("Error", "Failed to fetch topics", "error");
          });
      }

      function makeSummary(id, fileName) {
        const checkboxes = document.querySelectorAll(`input[name="topic_${id}"]:checked`);
        const selectedTopics = Array.from(checkboxes).map(cb => cb.value);

        if (selectedTopics.length === 0) {
          Swal.fire("No topics selected", "Please select at least one topic to summarize.", "warning");
          return;
        }

        const paramsObj = {
          userName: userName,
          selectedPatient: selectedPatient,
          selectedFileName: fileName,
          selectedTopics: selectedTopics
        };

        Swal.fire({
          title: "Generating summary...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          }
        });

        fetch("/make_summary_with_selected_topics", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(paramsObj)
        })
          .then(response => response.json())
          .then(data => {
            Swal.close();
            if (data.status === "success") {
              Swal.fire("Summary generated successfully.", "success");
              summaryObj = data.summary;
              document.getElementById("summaryGen_" + id).innerHTML = converter.makeHtml(data.summary);
            } else {
              Swal.fire("Error", data.message || "Failed to generate summary.", "error");
              document.getElementById("summaryGen_" + id).innerHTML = "Failed to generate summary.";
            }
          })
          .catch(error => {
            Swal.close();
            console.error("Summary error:", error);
            Swal.fire("Error", "Request failed", "error");
          });
      }

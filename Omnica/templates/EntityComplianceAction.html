    function renderSimplePieChart(element, chartdata, xcolumn, ycolumn) {
      am5.ready(function () {
        var root2 = am5.Root.new(element);

        // Set themes
        // https://www.amcharts.com/docs/v5/concepts/themes/
        root2.setThemes([am5themes_Animated.new(root2)]);

        // Create chart
        // https://www.amcharts.com/docs/v5/charts/percent-charts/pie-chart/
        var chart = root2.container.children.push(
          am5percent.PieChart.new(root2, {
            layout: root2.verticalLayout,
          })
        );

        // Create series
        // https://www.amcharts.com/docs/v5/charts/percent-charts/pie-chart/#Series
        var series = chart.series.push(
          am5percent.PieSeries.new(root2, {
            valueField: ycolumn,
            categoryField: xcolumn,
          })
        );

        // Set data
        // https://www.amcharts.com/docs/v5/charts/percent-charts/pie-chart/#Setting_data
        series.data.setAll(chartdata);

        // Play initial series animation
        // https://www.amcharts.com/docs/v5/concepts/animations/#Animation_of_series
        series.appear(1000, 100);
      });
    }
    function renderColumnChart(element, chartdata, xcolumn, ycolumn) {
      am5.ready(function () {
        // Create root element

        var root1 = am5.Root.new(element);

        // Set themes
        // https://www.amcharts.com/docs/v5/concepts/themes/
        root1.setThemes([am5themes_Animated.new(root1)]);
        // Create chart
        // https://www.amcharts.com/docs/v5/charts/xy-chart/
        var chart = root1.container.children.push(
          am5xy.XYChart.new(root1, {
            panX: true,
            panY: true,
            wheelX: "panX",
            wheelY: "zoomX",
          })
        );

        // Add cursor
        // https://www.amcharts.com/docs/v5/charts/xy-chart/cursor/
        var cursor = chart.set("cursor", am5xy.XYCursor.new(root1, {}));
        cursor.lineY.set("visible", false);

        // Create axes
        // https://www.amcharts.com/docs/v5/charts/xy-chart/axes/
        var xRenderer = am5xy.AxisRendererX.new(root1, {
          minGridDistance: 30,
        });
        //xRenderer.labels.template.setAll({
        //    rotation: -90,
        //    centerY: am5.p50,
        //    centerX: am5.p100,
        //    paddingRight: 15
        //});

        var xAxis = chart.xAxes.push(
          am5xy.CategoryAxis.new(root1, {
            maxDeviation: 0.3,
            categoryField: xcolumn,
            renderer: xRenderer,
            tooltip: am5.Tooltip.new(root1, {}),
          })
        );
        xRenderer.grid.template.set("visible", false);

        var yAxis = chart.yAxes.push(
          am5xy.ValueAxis.new(root1, {
            maxDeviation: 0.3,
            renderer: am5xy.AxisRendererY.new(root1, {}),
          })
        );

        // Create series
        // https://www.amcharts.com/docs/v5/charts/xy-chart/series/
        var series = chart.series.push(
          am5xy.ColumnSeries.new(root1, {
            name: "Series 1",
            xAxis: xAxis,
            yAxis: yAxis,
            valueYField: ycolumn,
            sequencedInterpolation: true,
            categoryXField: xcolumn,
            tooltip: am5.Tooltip.new(root1, {
              labelText: "{valueY}",
            }),
          })
        );

        series.columns.template.setAll({
          cornerRadiusTL: 5,
          cornerRadiusTR: 5,
        });
        series.columns.template.adapters.add("fill", (fill, target) => {
          return chart.get("colors").getIndex(series.columns.indexOf(target));
        });

        series.columns.template.adapters.add("stroke", (stroke, target) => {
          return chart.get("colors").getIndex(series.columns.indexOf(target));
        });

        // Set data
        var data = chartdata;
        xAxis.data.setAll(data);
        series.data.setAll(data);

        // Make stuff animate on load
        // https://www.amcharts.com/docs/v5/concepts/animations/
        series.appear(1000);
        chart.appear(1000, 100);
      });
    }
    function generateTimeline(timelineData) {
      $("#timelineView").html("");
      for (let i = 0; i < timelineData.length; i++) {
        tObj = timelineData[i];
        let tClass = "left";
        let tIcon = "";
        if (tObj["Event Type"] == "Visit") tIcon = "docvisit.jpeg";
        else if (tObj["Event Type"].includes("Lab")) tIcon = "diagnosis.png";
        else if (tObj["Event Type"].includes("Medication"))
          tIcon = "medicine.jpeg";
        else if (tObj["Event Type"] == "Surgery") tIcon = "surgery.jpeg";
        else tIcon = "docvisit.jpeg";
        if (i % 2 == 0) tClass = "left";
        else tClass = "right";
        let substr = tObj["Event Description"].substr(0, 40);
        // console.log(substr);
        let tHtml = `<div class="tcontainer ${tClass}">
                  <div class="date">${tObj["Time"]}</div>
                  <img class="icon" src="static/CDN/images/${tIcon}"></img>
                  <div class="content">
                    <h2>${tObj["Event Type"]}</h2>
                    <div class="ctooltip">
                      ${substr}<span class="ctooltiptext">${tObj["Event Description"]}</span>
                    </div>
                  </div>
                </div>`;
        $("#timelineView").append(tHtml);
      }
    }

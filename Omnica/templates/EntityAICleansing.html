      function csvJSON(csv) {
    var lines = csv.split("\n");
    var result = [];
    var headers = lines[0].split(",");

    for (var i = 1; i < lines.length; i++) {
        var obj = {};
        var currentline = lines[i].split(",");

        for (var j = 0; j < headers.length; j++) {
            var value = currentline[j];

            // Check if the value contains any non-numeric characters (excluding decimal points)
            if (/[^0-9.-]/.test(value)) {
                // If it does, treat it as a string
                obj[headers[j]] = value;
            } else {
                // Otherwise, try to parse it as a number
                try {
                    value = parseFloat(value);
                    if (isNaN(value)) {
                        value = parseInt(value);
                        if (isNaN(value)) {
                            value = currentline[j]; // Revert to string if both fail
                        }
                    }
                    obj[headers[j]] = value;
                } catch (error) {
                    console.warn("Error parsing value:", value, error);
                    obj[headers[j]] = currentline[j] //if error, revert to string
                }
            }
        }
        result.push(obj);
    }
    return result;
}

      function countMismatches(arr1, arr2) {
        let mismatchCount = 0;

        // Ensure both arrays have the same length
        if (arr1.length !== arr2.length) {
          return -1; // Indicate unequal array lengths
        }

        // Iterate through each object in the arrays
        for (let i = 0; i < arr1.length; i++) {
          const obj1 = arr1[i];
          const obj2 = arr2[i];

          // Iterate through each key-value pair in the objects
          for (const key in obj1) {
            if (obj1[key] !== obj2[key]) {
              mismatchCount++;
              break; // If one mismatch is found, move to the next object
            }
          }
        }

        return mismatchCount;
      }
